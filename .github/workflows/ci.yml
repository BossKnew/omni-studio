name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://omnistudio:quality-only@localhost:5432/omnistudio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dependency licenses
        run: npm run licenses:check
      - name: Check security configuration
        run: npm run security-configs:check
      - name: Check Compose security invariants
        run: npm run compose-security:check
      - name: Audit production dependencies
        run: npm audit --audit-level=high

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: omnistudio
      POSTGRES_USER: omnistudio
      POSTGRES_PASSWORD: CiPostgres-Password-2026!
      REDIS_PASSWORD: CiRedis-Password-2026!
      PROVIDER_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MFA_SECRET_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: CiAdmin-Password-2026!
      HTTP_BIND_ADDRESS: 127.0.0.1
      HTTP_PORT: "8080"
      APP_ORIGINS: http://127.0.0.1:8080
      ALLOW_INSECURE_HTTP: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --detach --build
      - name: Verify the public health endpoint
        run: curl --fail --show-error --silent --retry 40 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/v1/health
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
