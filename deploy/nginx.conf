map $http_x_real_ip $kv_forwarded_client_ip {
  default $http_x_real_ip;
  "" $remote_addr;
}

map "${FORWARDED_HEADERS_MODE}" $kv_client_ip {
  default $remote_addr;
  trusted-single-proxy $kv_forwarded_client_ip;
}

map $http_x_forwarded_proto $kv_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map "${FORWARDED_HEADERS_MODE}" $kv_request_proto {
  default $scheme;
  trusted-single-proxy $kv_forwarded_proto;
}

map $kv_request_proto $kv_csp_upgrade {
  default "";
  https "upgrade-insecure-requests";
}

limit_req_zone $kv_client_ip zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $kv_client_ip zone=connections_per_ip:10m;

server {
  listen 80 default_server;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kv_api_upstream api:4000;
  server_tokens off;
  client_max_body_size 21m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 60s;
  gzip on;
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; $kv_csp_upgrade" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # The API authenticates every request before redirecting internally. Nginx
  # then serves the file with sendfile, keeping large media streams out of the
  # memory-constrained Node process. This URI is never reachable externally.
  location ^~ /_protected_media/.staging {
    internal;
    return 404;
  }

  location ^~ /_protected_media/ {
    internal;
    alias /data/media/;
    sendfile on;
    open_file_cache max=200 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;
  }

  # Authenticated media is explicitly private-cacheable. Keep this location
  # ahead of the generic API no-store policy so the API's private header wins.
  location ~ "^/api/v1/assets/[0-9a-fA-F-]{36}/content$" {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://$kv_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $kv_client_ip;
    proxy_set_header X-Forwarded-For $kv_client_ip;
    proxy_set_header X-Forwarded-Proto $kv_request_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 600s;
  }

  location = /api/v1/generations/events {
    limit_conn connections_per_ip 3;
    proxy_pass http://$kv_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $kv_client_ip;
    proxy_set_header X-Forwarded-For $kv_client_ip;
    proxy_set_header X-Forwarded-Proto $kv_request_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_read_timeout 15m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; $kv_csp_upgrade" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering no always;
  }

  # Catalog GETs opt into short private caching. Keep this ahead of the generic
  # API no-store policy so the upstream Cache-Control header can reach the browser.
  location ~ "^/api/v1/(models|option-labels|style-presets)$" {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://$kv_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $kv_client_ip;
    proxy_set_header X-Forwarded-For $kv_client_ip;
    proxy_set_header X-Forwarded-Proto $kv_request_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 600s;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; $kv_csp_upgrade" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://$kv_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $kv_client_ip;
    proxy_set_header X-Forwarded-For $kv_client_ip;
    proxy_set_header X-Forwarded-Proto $kv_request_proto;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 600s;
    proxy_hide_header Cache-Control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; $kv_csp_upgrade" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = / { try_files /index.html =404; expires -1; }
  location = /login { try_files /index.html =404; expires -1; }
  location = /login/ { try_files /index.html =404; expires -1; }
  location = /admin { try_files /index.html =404; expires -1; }
  location = /admin/ { try_files /index.html =404; expires -1; }
  location = /settings { try_files /index.html =404; expires -1; }
  location = /settings/ { try_files /index.html =404; expires -1; }
  location / { try_files $uri =404; }
}
