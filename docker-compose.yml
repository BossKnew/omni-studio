name: omni-studio

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-512MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnistudio}
      POSTGRES_USER: ${POSTGRES_USER:-omnistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.75}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: [redis-server, --appendonly, yes, --appendfsync, everysec, --maxmemory, "${REDIS_MAXMEMORY:-128mb}", --maxmemory-policy, noeviction, --requirepass, "${REDIS_PASSWORD:-}"]
    volumes: [redis_data:/data]
    networks: [data]
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  migrate:
    <<: *app-hardening
    build: { context: ., target: migrate }
    image: omni-studio:migrate
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: "no"
    networks: [app, data]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-omnistudio}
      POSTGRES_USER: ${POSTGRES_USER:-omnistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    <<: *app-hardening
    build: { context: ., target: api }
    image: omni-studio:api
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    networks: [app, data]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-omnistudio}
      POSTGRES_USER: ${POSTGRES_USER:-omnistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PROVIDER_SECRET_KEY: ${PROVIDER_SECRET_KEY:-}
      PROVIDER_SECRET_KEY_FILE: ${PROVIDER_SECRET_KEY_FILE:-}
      PROVIDER_SECRET_KEYS: ${PROVIDER_SECRET_KEYS:-}
      PROVIDER_SECRET_KEYS_FILE: ${PROVIDER_SECRET_KEYS_FILE:-}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:-}
      MFA_SECRET_KEY_FILE: ${MFA_SECRET_KEY_FILE:-}
      MFA_SECRET_KEYS: ${MFA_SECRET_KEYS:-}
      MFA_SECRET_KEYS_FILE: ${MFA_SECRET_KEYS_FILE:-}
      MFA_SECRET_ACTIVE_KID: ${MFA_SECRET_ACTIVE_KID:-}
      MFA_SECRET_ACTIVE_KID_FILE: ${MFA_SECRET_ACTIVE_KID_FILE:-}
      MFA_ISSUER: ${MFA_ISSUER:-OmniStudio}
      MEDIA_ROOT: /data/media
      APP_ORIGINS: ${APP_ORIGINS:-}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      FORWARDED_HEADERS_MODE: ${FORWARDED_HEADERS_MODE:-ignore}
      HTTP_BIND_ADDRESS: ${HTTP_BIND_ADDRESS:-127.0.0.1}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_USERNAME_FILE: ${BOOTSTRAP_ADMIN_USERNAME_FILE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      OUTBOUND_PRIVATE_ALLOWLIST: ${OUTBOUND_PRIVATE_ALLOWLIST:-}
      OUTBOUND_HTTP_ALLOWLIST: ${OUTBOUND_HTTP_ALLOWLIST:-}
      MAX_ACTIVE_JOBS_PER_USER: ${MAX_ACTIVE_JOBS_PER_USER:-3}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-200}
      USER_STORAGE_QUOTA_GIB: ${USER_STORAGE_QUOTA_GIB:-10}
      MAX_SSE_CONNECTIONS_PER_USER: ${MAX_SSE_CONNECTIONS_PER_USER:-3}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-50}
      LOGIN_PAIR_LIMIT: ${LOGIN_PAIR_LIMIT:-10}
      LOGIN_ACCOUNT_FAILURE_LIMIT: ${LOGIN_ACCOUNT_FAILURE_LIMIT:-30}
      REGISTRATION_IP_LIMIT: ${REGISTRATION_IP_LIMIT:-5}
      GENERATION_RATE_LIMIT: ${GENERATION_RATE_LIMIT:-10}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-30}
      MAX_CONCURRENT_UPLOADS_PER_USER: ${MAX_CONCURRENT_UPLOADS_PER_USER:-2}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      IMAGE_PROCESSING_CONCURRENCY: ${IMAGE_PROCESSING_CONCURRENCY:-1}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-1}
      PROCESS_ROLE: ${PROCESS_ROLE:-all}
      MEDIA_X_ACCEL_REDIRECT: ${MEDIA_X_ACCEL_REDIRECT:-true}
      MALLOC_ARENA_MAX: "2"
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MIB:-768}
    volumes: ["${MEDIA_VOLUME:-media_data}:/data/media"]
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    cpus: ${API_CPU_LIMIT:-1.5}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    build: { context: ., target: web }
    image: omni-studio:web
    restart: unless-stopped
    networks: [app]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    pids_limit: 64
    ports: ["${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    environment:
      FORWARDED_HEADERS_MODE: ${FORWARDED_HEADERS_MODE:-ignore}
    volumes: ["${MEDIA_VOLUME:-media_data}:/data/media:ro"]
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=16m
      - /etc/nginx/conf.d:rw,nosuid,size=2m
      - /var/run:rw,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPU_LIMIT:-0.25}
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  app:
  data:
    internal: true
